name: Feature Request
description: Suggest a new command, option, or capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. The more context you give about your real workflow, the easier it is to design the right solution.

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Semantic model (pbi model / pbi source)
        - DAX / measures (pbi measure / pbi dax)
        - Governance / BPA (pbi govern)
        - Report authoring (pbi report / pbi visual)
        - Deployment (pbi deploy / pbi snapshot)
        - XMLA / Fabric connectivity
        - Claude Code skills
        - CI/CD integration
        - Documentation generation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow pain point. "I'm trying to... but currently I have to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the CLI to do? A rough command sketch is helpful.
      render: bash
      placeholder: |
        pbi model export --format csv --output ./columns.csv
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other tools or workarounds you currently use

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to your workflow?
      options:
        - Nice to have
        - Significant time saver
        - Blocking — I can't use the tool without this
    validations:
      required: true
