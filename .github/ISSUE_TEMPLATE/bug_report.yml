name: Bug Report
description: Report a reproducible bug in pbi-cli
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a bug. Fill in the fields below so we can reproduce it."

  - type: input
    id: version
    attributes:
      label: pbi-cli version
      placeholder: "pbi --version"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "python --version"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - desktop
        - xmla
        - mock
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command run
      placeholder: "pbi govern check --fail-on warning"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour (include full error output)
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
