name: "pbi-cli Action"
description: >
  Install pbi-cli, run governance checks and DAX unit tests against a Power BI
  semantic model, and post results as a pull-request comment (Epic E6).

branding:
  icon: "bar-chart-2"
  color: "yellow"

inputs:
  python-version:
    description: "Python version to use."
    required: false
    default: "3.11"

  pbi-cli-version:
    description: "pbi-enterprise-cli version to install (e.g. '>=4.0'). Defaults to latest."
    required: false
    default: ""

  extras:
    description: "Optional extras to install alongside pbi-cli (e.g. 'sources,server')."
    required: false
    default: ""

  govern-check:
    description: "Run 'pbi govern check' and fail on errors."
    required: false
    default: "true"

  dax-test:
    description: "Run 'pbi dax test' if test suites are found."
    required: false
    default: "true"

  dax-test-path:
    description: "Path to DAX test YAML suites directory."
    required: false
    default: "tests/fixtures/measures"

  backend:
    description: "Backend to use: 'mock' (default, no PBI Desktop needed) or 'desktop'."
    required: false
    default: "mock"

  post-comment:
    description: "Post results as a PR comment (requires GITHUB_TOKEN)."
    required: false
    default: "true"

  github-token:
    description: "GitHub token for posting PR comments."
    required: false
    default: ${{ github.token }}

outputs:
  govern-violations:
    description: "Number of governance violations found."
    value: ${{ steps.govern.outputs.violations }}

  dax-tests-passed:
    description: "Number of DAX tests that passed."
    value: ${{ steps.dax.outputs.passed }}

  dax-tests-failed:
    description: "Number of DAX tests that failed."
    value: ${{ steps.dax.outputs.failed }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pbi-enterprise-cli
      shell: bash
      run: |
        EXTRAS="${{ inputs.extras }}"
        VERSION="${{ inputs.pbi-cli-version }}"
        if [ -n "$EXTRAS" ] && [ -n "$VERSION" ]; then
          pip install "pbi-enterprise-cli[$EXTRAS]$VERSION"
        elif [ -n "$EXTRAS" ]; then
          pip install "pbi-enterprise-cli[$EXTRAS]"
        elif [ -n "$VERSION" ]; then
          pip install "pbi-enterprise-cli$VERSION"
        else
          pip install pbi-enterprise-cli
        fi

    - name: Run governance check
      id: govern
      shell: bash
      if: inputs.govern-check == 'true'
      run: |
        set +e
        OUTPUT=$(pbi --backend ${{ inputs.backend }} --json govern check 2>&1)
        EXIT_CODE=$?
        echo "output<<EOF" >> $GITHUB_OUTPUT
        echo "$OUTPUT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        VIOLATIONS=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "0")
        echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
        exit $EXIT_CODE

    - name: Run DAX tests
      id: dax
      shell: bash
      if: inputs.dax-test == 'true'
      run: |
        PASSED=0
        FAILED=0
        TEST_DIR="${{ inputs.dax-test-path }}"
        if [ -d "$TEST_DIR" ]; then
          for yaml_file in "$TEST_DIR"/*.yaml "$TEST_DIR"/*.yml; do
            [ -f "$yaml_file" ] || continue
            OUTPUT=$(pbi --backend ${{ inputs.backend }} dax test --suite "$yaml_file" --json 2>&1)
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          done
        fi
        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        [ "$FAILED" -eq 0 ] || exit 1

    - name: Post PR comment
      shell: bash
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        VIOLATIONS="${{ steps.govern.outputs.violations || '0' }}"
        PASSED="${{ steps.dax.outputs.passed || '0' }}"
        FAILED="${{ steps.dax.outputs.failed || '0' }}"

        if [ "$VIOLATIONS" -eq 0 ] && [ "$FAILED" -eq 0 ]; then
          STATUS="✅ All checks passed"
        else
          STATUS="❌ Issues found"
        fi

        BODY="## pbi-cli Check Results

$STATUS

| Check | Result |
|-------|--------|
| Governance violations | $VIOLATIONS |
| DAX tests passed | $PASSED |
| DAX tests failed | $FAILED |

> Generated by [pbi-cli-action](https://github.com/marketplace/actions/pbi-cli)"

        gh pr comment ${{ github.event.pull_request.number }} \
          --body "$BODY" \
          --repo ${{ github.repository }} || true
