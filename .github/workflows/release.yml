name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ai,server,sources]"
      - name: Run full test suite (excluding e2e)
        run: pytest -m "not e2e" --no-cov

  release:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install build
      - run: python -m build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke-test:
    name: Post-release Smoke Test
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Install published package from PyPI
        run: |
          pip install uv
          uv tool install pbi-enterprise-cli
      - name: Verify CLI entry point
        run: uv tool run pbi --version
      - name: Run doctor against mock backend
        run: uv tool run pbi --backend mock doctor
      - name: Run governance check against mock backend
        run: uv tool run pbi --backend mock govern check
