name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ai,server,sources]"
      - name: Run full test suite (excluding e2e)
        run: pytest -m "not e2e" --no-cov

  release:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install build
      - run: python -m build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke-test:
    name: Post-release Smoke Test
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Wait for PyPI CDN propagation then install
        # PyPI CDN can take 60-120 s to propagate a new release.
        # Retry up to 6 times with 30 s backoff (max wait ~3 min).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in 1 2 3 4 5 6; do
            pip install "pbi-enterprise-cli==$VERSION" && break
            echo "Attempt $i failed — waiting 30 s for PyPI propagation..."
            sleep 30
          done
      - name: Verify CLI entry point
        run: pbi --version
      - name: Run doctor against mock backend
        run: pbi --backend mock doctor
      - name: Run governance check against mock backend
        run: pbi --backend mock govern check
