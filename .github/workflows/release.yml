name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ai,server,sources]"
      - name: Run full test suite (excluding e2e)
        run: pytest -m "not e2e" --no-cov

  release:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write  # required for OIDC trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/pbi-enterprise-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install build
      - run: python -m build
      - name: Publish to PyPI (OIDC trusted publishing — no token required)
        uses: pypa/gh-action-pypi-publish@release/v1
