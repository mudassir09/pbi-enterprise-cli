name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check src/ tests/
      - run: mypy src/ --ignore-missing-imports

  security:
    name: Dependency Security Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit --requirement <(pip install -e ".[all]" --dry-run -q 2>&1 | grep "^Collecting" | sed 's/Collecting //' | sed 's/ .*//')
        continue-on-error: true  # advisory only; harden to false once baseline is clean

  test:
    name: Unit + Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (dev + all optional extras except playwright browsers)
        run: |
          pip install -e ".[dev,ai,server,sources]"
          pip install Pillow python-wcag-contrast-ratio  # viz extras minus playwright
      - name: Run tests with coverage (excluding e2e)
        run: pytest -m "not e2e" --cov-report=xml
        # addopts in pyproject.toml supplies --cov, --cov-fail-under=70, and omit rules
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  windows-test:
    name: Windows Tests — TOM/XMLA backends (Python 3.11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (including pythonnet for TOM/XMLA)
        run: pip install -e ".[dev,ai,server,sources]" && pip install pythonnet
      - name: Run TOM/XMLA backend tests
        run: pytest tests/integration/test_tom_backend.py tests/unit/test_xmla_backend.py -v --no-cov
        continue-on-error: false

  contract:
    name: JSON Contract Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,server]"
      - name: Run JSON contract test suite
        run: pytest tests/unit/test_json_contracts.py -v --no-cov

  pbir-format:
    name: PBIR File-Format Regression Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Bookmark format assertions
        run: pytest tests/unit/test_commands_report_new.py::TestBookmarkFileFormat -v --no-cov
      - name: Conditional formatting format assertions
        run: |
          pytest tests/unit/test_commands_visual_format.py::TestVisualFormat::test_format_color_scale_writes_back_color_property -v --no-cov
          pytest tests/unit/test_commands_visual_format.py::TestVisualFormat::test_format_color_scale_uses_linear_gradient3_lowercase -v --no-cov
          pytest tests/unit/test_commands_visual_format.py::TestVisualFormat::test_format_color_scale_selector_has_data_wildcard -v --no-cov
          pytest tests/unit/test_commands_visual_format.py::TestVisualFormat::test_format_color_scale_no_duplicate_entries -v --no-cov
      - name: Projection helper tests
        run: pytest tests/unit/test_pbir_projection.py -v --no-cov
