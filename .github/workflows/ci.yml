name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - run: ruff check src/ tests/
      - run: mypy src/ --ignore-missing-imports

  test:
    name: Unit + Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (dev + ai extras)
        run: pip install -e ".[dev,ai]"
      - name: Run tests (excluding e2e)
        run: pytest -m "not e2e" --cov=src/pbi_cli --cov-report=xml -v
      - name: Coverage gate (>= 70%)
        run: pytest -m "not e2e" --cov=src/pbi_cli --cov-fail-under=70
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  contract:
    name: JSON Contract Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run JSON contract test suite
        run: pytest tests/unit/test_json_contracts.py -v

  pbir-format:
    name: PBIR File-Format Regression Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Bookmark format assertions
        run: pytest tests/unit/test_commands_report_new.py::TestBookmarkFileFormat -v
      - name: Conditional formatting format assertions
        run: |
          pytest tests/unit/test_commands_visual_format.py::TestVisualFormat::test_format_color_scale_writes_back_color_property -v
          pytest tests/unit/test_commands_visual_format.py::TestVisualFormat::test_format_color_scale_uses_linear_gradient3_lowercase -v
          pytest tests/unit/test_commands_visual_format.py::TestVisualFormat::test_format_color_scale_selector_has_data_wildcard -v
          pytest tests/unit/test_commands_visual_format.py::TestVisualFormat::test_format_color_scale_no_duplicate_entries -v
      - name: Projection helper tests
        run: pytest tests/unit/test_pbir_projection.py -v
