name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  governance-rules:
    name: Governance Rule Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run governance rule tests
        run: pytest tests/ -m "not e2e" -k "govern" -v
      - name: Run all unit tests
        run: pytest tests/ -m "not e2e" -v

  skill-triggers:
    name: Skill Trigger Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Validate skill frontmatter
        run: |
          python -c "
          import yaml, pathlib, sys
          errors = []
          for f in pathlib.Path('skills').rglob('SKILL.md'):
              content = f.read_text(encoding='utf-8')
              if content.startswith('---'):
                  parts = content.split('---', 2)
                  if len(parts) >= 3:
                      try:
                          meta = yaml.safe_load(parts[1])
                          required = ['name', 'description', 'version']
                          for r in required:
                              if r not in meta:
                                  errors.append(f'{f}: missing {r}')
                      except Exception as e:
                          errors.append(f'{f}: YAML parse error: {e}')
          if errors:
              print('SKILL.md validation failures:')
              for e in errors: print(' -', e)
              sys.exit(1)
          print(f'All SKILL.md files valid')
          "
