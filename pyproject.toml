[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-cli-tool"
version = "4.0.0.dev0"
description = "Power BI one-stop-shop platform — CLI for AI-driven Power BI development"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT AND LicenseRef-Microsoft-AS-Client-Libraries" }
keywords = ["power-bi", "cli", "dax", "tmdl", "pbir"]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pythonnet>=3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai   = ["anthropic>=0.25"]
viz  = ["Pillow>=10.0", "python-wcag-contrast-ratio>=1.0", "playwright>=1.44"]
xmla = ["msal>=1.28"]
server  = ["fastapi>=0.110", "uvicorn>=0.29"]
sources = ["sqlalchemy>=2.0", "openpyxl>=3.1", "httpx>=0.27"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4.0", "mypy>=1.10"]
all = ["pbi-cli-tool[ai,viz,xmla,server,sources,dev]"]

[project.scripts]
pbi = "pbi_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
# strict mode is disabled: backends use pythonnet/AMO dynamic dispatch (Any is intentional)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: requires live Power BI Desktop or XMLA endpoint"]
