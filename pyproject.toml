[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-enterprise-cli"
version = "1.2.0"
description = "Power BI & Microsoft Fabric automation CLI — TMDL/XMLA/REST backends, Python-native BPA governance, DAX testing & lint, PBIR authoring, MCP server, AI measures"
readme = "README.pypi.md"
requires-python = ">=3.10"
license = { text = "MIT AND LicenseRef-Microsoft-AS-Client-Libraries" }
keywords = [
    "power-bi", "powerbi", "cli", "dax", "tmdl", "pbir", "xmla",
    "fabric", "microsoft-fabric", "governance", "bpa",
    "semantic-model", "claude-code", "ai-agent", "mcp",
]
authors = [
    { name = "Mudassir", email = "mir.mudassir1@gmail.com" }
]
maintainers = [
    { name = "Mudassir", email = "mir.mudassir1@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pythonnet>=3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mudassir09/pbi-enterprise-cli"
Repository = "https://github.com/mudassir09/pbi-enterprise-cli"
Documentation = "https://github.com/mudassir09/pbi-enterprise-cli#readme"
Changelog = "https://github.com/mudassir09/pbi-enterprise-cli/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/mudassir09/pbi-enterprise-cli/issues"
"Security Policy" = "https://github.com/mudassir09/pbi-enterprise-cli/blob/main/SECURITY.md"

[project.optional-dependencies]
ai   = ["anthropic>=0.105.2"]
viz  = ["Pillow>=10.0", "wcag-contrast-ratio>=0.9", "playwright>=1.44"]
xmla = ["msal>=1.28"]
server  = ["fastapi>=0.136.3", "uvicorn>=0.48.0"]
sources = ["sqlalchemy>=2.0", "openpyxl>=3.1.5", "httpx>=0.27"]
sql  = ["pyodbc>=5.1"]
dev = ["pytest>=9.0.3", "pytest-cov>=7.1.0", "ruff>=0.15.15", "mypy>=2.1.0"]
all = ["pbi-enterprise-cli[ai,viz,xmla,server,sources,sql,dev]"]

[project.scripts]
pbi = "pbi_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Non-Python data that must ship in the wheel. Without this the wheel contains
# only .py files, and the xmla/desktop backends (DLLs), `pbi skills install`
# (skills), and `pbi server` (static UI) all break on a pip install.
# NOTE: the AMO/ADOMD DLLs are git-ignored (proprietary) but must be present in
# the build tree when the wheel is built so they get bundled.
pbi_cli = [
    "dlls/*.dll",
    "skills/**/*.md",
    "server/static/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
# strict mode is disabled: backends use pythonnet/AMO dynamic dispatch (Any is intentional)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pbi_cli --cov-report=term-missing --cov-fail-under=75"
markers = ["e2e: requires live Power BI Desktop or XMLA endpoint"]

[tool.coverage.run]
omit = [
    # TOM/XMLA backends require Windows .NET (pythonnet/AMO) — untestable on Linux CI
    "src/pbi_cli/backends/tom_backend.py",
    "src/pbi_cli/backends/xmla_backend.py",
    # PBIR backend integration tests require actual PBIR files and are skipped in CI
    "src/pbi_cli/backends/pbir_backend.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]
omit = [
    "src/pbi_cli/backends/tom_backend.py",
    "src/pbi_cli/backends/xmla_backend.py",
    "src/pbi_cli/backends/pbir_backend.py",
]
