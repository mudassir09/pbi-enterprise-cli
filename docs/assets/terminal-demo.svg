<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400"
     font-family="'Consolas','SF Mono','Courier New',monospace">
  <defs>
    <linearGradient id="win" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#10151C"/>
    </linearGradient>
  </defs>

  <!-- Window -->
  <rect width="820" height="400" rx="12" fill="url(#win)" stroke="#30363D" stroke-width="1"/>
  <!-- Title bar -->
  <rect width="820" height="40" rx="12" fill="#161B22"/>
  <rect y="28" width="820" height="12" fill="#161B22"/>
  <line x1="0" y1="40" x2="820" y2="40" stroke="#21262D" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="20" r="6" fill="#27C93F"/>
  <text x="410" y="25" font-size="13" fill="#6E7681" text-anchor="middle">pbi — Power BI CLI</text>

  <!-- ── transcript (each line reveals on a 11s loop) ── -->
  <g font-size="14.5">

    <!-- 1 -->
    <text x="24" y="80" fill="#58A6FF" opacity="0"><tspan fill="#6E7681">$ </tspan>pbi connect
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.016;0.036;0.95;1"/></text>
    <!-- 2 -->
    <text x="24" y="110" opacity="0"><tspan fill="#3FB950">✓ </tspan><tspan fill="#C9D1D9">Connected — Financials (1500) · 4 tables · 12 measures</tspan>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.08;0.10;0.95;1"/></text>

    <!-- 3 -->
    <text x="24" y="146" fill="#58A6FF" opacity="0"><tspan fill="#6E7681">$ </tspan>pbi govern check --fail-on error
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.171;0.191;0.95;1"/></text>
    <!-- 4 -->
    <text x="24" y="176" opacity="0"><tspan fill="#D29922">⚠ </tspan><tspan fill="#8B949E">3 violations  ·  </tspan><tspan fill="#58A6FF">pbi govern fix --auto</tspan><tspan fill="#8B949E">  →  </tspan><tspan fill="#3FB950">all fixed</tspan>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.235;0.255;0.95;1"/></text>

    <!-- 5 -->
    <text x="24" y="212" fill="#58A6FF" opacity="0"><tspan fill="#6E7681">$ </tspan>pbi dax test --suite tests/measures/
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.325;0.345;0.95;1"/></text>
    <!-- 6 -->
    <text x="24" y="242" opacity="0"><tspan fill="#3FB950">✓ </tspan><tspan fill="#C9D1D9">18 measures passed in 0.4s</tspan>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.389;0.409;0.95;1"/></text>

    <!-- 7 -->
    <text x="24" y="278" fill="#58A6FF" opacity="0"><tspan fill="#6E7681">$ </tspan>pbi --backend fabric measure add --table Sales --name "Margin %" …
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.48;0.50;0.95;1"/></text>
    <!-- 8 -->
    <text x="24" y="308" opacity="0"><tspan fill="#3FB950">✓ </tspan><tspan fill="#C9D1D9">pushed to a live Fabric model — any OS, no Windows, no .NET</tspan>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.562;0.582;0.95;1"/></text>

    <!-- trailing prompt + blinking cursor -->
    <g opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.60;0.62;0.95;1"/>
      <text x="24" y="344" fill="#6E7681">$ </text>
      <rect x="40" y="332" width="9" height="16" fill="#58A6FF">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.06s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
