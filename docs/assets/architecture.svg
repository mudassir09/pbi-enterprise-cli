<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#161B22"/>
    </linearGradient>
    <linearGradient id="cli-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1C2128"/>
      <stop offset="100%" style="stop-color:#161B22"/>
    </linearGradient>
    <linearGradient id="desktop-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2137"/>
      <stop offset="100%" style="stop-color:#0A1929"/>
    </linearGradient>
    <linearGradient id="xmla-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2D1A"/>
      <stop offset="100%" style="stop-color:#091A10"/>
    </linearGradient>
    <linearGradient id="mock-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1A0D"/>
      <stop offset="100%" style="stop-color:#1A0D09"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0078D4"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3FB950"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F78166"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="url(#bg)" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#0078D4" rx="2"/>

  <!-- Title -->
  <text x="450" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="16"
        font-weight="600" fill="#8B949E" text-anchor="middle" letter-spacing="2">
    THREE-BACKEND ARCHITECTURE
  </text>

  <!-- ─── pbi CLI box (centre) ─── -->
  <rect x="325" y="60" width="250" height="110" fill="url(#cli-grad)"
        rx="10" stroke="#30363D" stroke-width="1.5"/>
  <rect x="325" y="60" width="250" height="36" fill="#21262D" rx="10"/>
  <rect x="325" y="84" width="250" height="12" fill="#21262D"/>
  <text x="450" y="83" font-family="'Consolas','Courier New',monospace" font-size="14"
        font-weight="700" fill="#58A6FF" text-anchor="middle">pbi</text>
  <text x="450" y="108" font-family="'Segoe UI', system-ui, sans-serif" font-size="12"
        fill="#C9D1D9" text-anchor="middle">pbi-enterprise-cli</text>
  <text x="450" y="126" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#8B949E" text-anchor="middle">25+ command groups</text>
  <text x="450" y="144" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#8B949E" text-anchor="middle">Claude Code · FastAPI server</text>

  <!-- Governance layer -->
  <rect x="325" y="182" width="250" height="44" fill="#1C2128"
        rx="8" stroke="#30363D" stroke-width="1"/>
  <text x="450" y="200" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        font-weight="600" fill="#F0883E" text-anchor="middle">Governance Engine</text>
  <text x="450" y="218" font-family="'Segoe UI', system-ui, sans-serif" font-size="10"
        fill="#8B949E" text-anchor="middle">Built-in rules · BPA · Custom plugins</text>

  <!-- ─── Arrow lines from CLI box ─── -->
  <!-- → Desktop -->
  <line x1="325" y1="115" x2="196" y2="260" stroke="#0078D4" stroke-width="1.8"
        stroke-dasharray="none" marker-end="url(#arrow-blue)"/>
  <!-- → XMLA -->
  <line x1="450" y1="170" x2="450" y2="258" stroke="#3FB950" stroke-width="1.8"
        marker-end="url(#arrow-green)"/>
  <!-- → Mock -->
  <line x1="575" y1="115" x2="704" y2="260" stroke="#F78166" stroke-width="1.8"
        marker-end="url(#arrow-orange)"/>

  <!-- ─── Desktop backend ─── -->
  <rect x="60" y="260" width="230" height="130" fill="url(#desktop-grad)"
        rx="10" stroke="#0078D4" stroke-width="1.5"/>
  <rect x="60" y="260" width="230" height="34" fill="#0D2137" rx="10"/>
  <rect x="60" y="282" width="230" height="12" fill="#0D2137"/>
  <text x="175" y="282" font-family="'Segoe UI', system-ui, sans-serif" font-size="13"
        font-weight="700" fill="#58A6FF" text-anchor="middle">desktop</text>
  <text x="175" y="304" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#C9D1D9" text-anchor="middle">TOM via pythonnet + AMO</text>
  <text x="175" y="320" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#8B949E" text-anchor="middle">Requires: Windows +</text>
  <text x="175" y="336" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#8B949E" text-anchor="middle">Power BI Desktop open</text>
  <rect x="90" y="350" width="170" height="24" fill="#0078D41A" rx="6"
        stroke="#0078D4" stroke-width="0.8"/>
  <text x="175" y="366" font-family="'Consolas','Courier New',monospace" font-size="10"
        fill="#58A6FF" text-anchor="middle">--backend desktop</text>

  <!-- ─── XMLA backend ─── -->
  <rect x="325" y="260" width="250" height="130" fill="url(#xmla-grad)"
        rx="10" stroke="#3FB950" stroke-width="1.5"/>
  <rect x="325" y="260" width="250" height="34" fill="#0D2D1A" rx="10"/>
  <rect x="325" y="282" width="250" height="12" fill="#0D2D1A"/>
  <text x="450" y="282" font-family="'Segoe UI', system-ui, sans-serif" font-size="13"
        font-weight="700" fill="#3FB950" text-anchor="middle">xmla</text>
  <text x="450" y="304" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#C9D1D9" text-anchor="middle">Premium / Microsoft Fabric</text>
  <text x="450" y="320" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#8B949E" text-anchor="middle">No Desktop required</text>
  <text x="450" y="336" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#8B949E" text-anchor="middle">Service principal · Device flow</text>
  <rect x="355" y="350" width="190" height="24" fill="#3FB9501A" rx="6"
        stroke="#3FB950" stroke-width="0.8"/>
  <text x="450" y="366" font-family="'Consolas','Courier New',monospace" font-size="10"
        fill="#3FB950" text-anchor="middle">--backend xmla</text>

  <!-- ─── Mock backend ─── -->
  <rect x="610" y="260" width="230" height="130" fill="url(#mock-grad)"
        rx="10" stroke="#F78166" stroke-width="1.5"/>
  <rect x="610" y="260" width="230" height="34" fill="#2D1A0D" rx="10"/>
  <rect x="610" y="282" width="230" height="12" fill="#2D1A0D"/>
  <text x="725" y="282" font-family="'Segoe UI', system-ui, sans-serif" font-size="13"
        font-weight="700" fill="#F78166" text-anchor="middle">mock</text>
  <text x="725" y="304" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#C9D1D9" text-anchor="middle">CI/CD · Tests · Demos</text>
  <text x="725" y="320" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#8B949E" text-anchor="middle">Zero infrastructure</text>
  <text x="725" y="336" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#8B949E" text-anchor="middle">Works on Linux / macOS</text>
  <rect x="640" y="350" width="170" height="24" fill="#F781661A" rx="6"
        stroke="#F78166" stroke-width="0.8"/>
  <text x="725" y="366" font-family="'Consolas','Courier New',monospace" font-size="10"
        fill="#F78166" text-anchor="middle">--backend mock</text>

  <!-- Footer note -->
  <text x="450" y="406" font-family="'Segoe UI', system-ui, sans-serif" font-size="11"
        fill="#484F58" text-anchor="middle">
    Swap backends with  --backend desktop|xmla|mock  — same commands, same output
  </text>
</svg>
